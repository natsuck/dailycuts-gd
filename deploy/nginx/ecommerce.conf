# nginx origin server for The Daily Cuts.
# Sits behind Cloudflare in "Full (strict)" SSL mode:
#   - Visitors -> Cloudflare (HTTPS)
#   - Cloudflare -> this origin over TLS using an origin certificate
#     (Let's Encrypt or Cloudflare Origin CA). A trusted cert is required by
#     "Full (strict)".
# Copy to /etc/nginx/sites-available/ecommerce and symlink into sites-enabled.

server {
    listen 80;
    server_name thedailycuts.com www.thedailycuts.com;
    # Redirect all HTTP to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name thedailycuts.com www.thedailycuts.com;

    # Origin TLS certificate (used by Cloudflare Full strict).
    ssl_certificate     /etc/letsencrypt/live/thedailycuts.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thedailycuts.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/ecommerce/public;
    index index.php;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Don't serve hidden files.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # The /up health endpoint (registered via withRouting health:'/up') must
    # remain reachable even while maintenance mode ('php artisan down') is on,
    # so Cloudflare / load balancer health checks keep passing during deploy.
    location = /up {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Cache the built Vite assets aggressively (public/build).
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
