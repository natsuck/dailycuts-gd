[program:laravel-schedule]
; Runs the Laravel scheduler every minute. This drives the scheduled commands:
;   - orders:reconcile-maya     (every 5 min)
;   - orders:expire-unpaid      (every hour)
;   - orders:retry-lalamove-dispatch (every 15 min)
; Without this, unpaid orders never expire and lost webhooks are never
; reconciled. Adjust user/paths for your server, then copy to
; /etc/supervisor/conf.d/laravel-schedule.conf and restart supervisord.
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/ecommerce/artisan schedule:run
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/ecommerce/storage/logs/schedule.log
stopwaitsecs=3600
