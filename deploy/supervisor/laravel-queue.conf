[program:laravel-queue]
; Runs the Laravel queue worker that processes queued jobs (Lalamove dispatch,
; order confirmation + delivered emails, etc.). Without this, nothing queued
; ever runs. Adjust user/paths for your server, then copy to
; /etc/supervisor/conf.d/laravel-queue.conf and restart supervisord.
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/ecommerce/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --max-jobs=1000
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/ecommerce/storage/logs/queue-worker.log
stopwaitsecs=3600
